plugins {
    id 'com.android.application'
    // [إضافة جديدة] هذا المكوّن الإضافي ضروري لتطبيق ملف google-services.json
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.adhna.fooddelivery'
    compileSdk 34

    defaultConfig {
        applicationId "com.adhna.fooddelivery"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // تبعياتك الحالية
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ----------------------------------------------
    // 🔥 [الإضافات الجديدة] تبعيات Firebase للإشعارات
    // ----------------------------------------------
    
    // 1. Firebase BoM (Bill of Materials) - لإدارة إصدارات Firebase تلقائياً
    implementation platform('com.google.firebase:firebase-bom:33.5.0')
    
    // 2. مكتبة Firebase Cloud Messaging (المسؤولة عن الإشعارات)
    implementation 'com.google.firebase:firebase-messaging'
}
